<!DOCTYPE html>
<html>
<head>
    <title>Ping Pong</title>
    <style>
        body {
            background-color: black;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 4px solid white;
            background-color: #111;
            margin-top: 20px;
        }
        h1 {
            margin-top: 10px;
            color: #00ffcc;
        }
        p {
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>PING PONG the toooken</h1>
    <p>Use the UP and DOWN arrow keys to move your paddle!</p>

    <canvas id="pong" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("pong");
const ctx = canvas.getContext("2d");
const ballImg = new Image();
ballImg.src ="Screenshot_2026-11-15_142238-removebg-preview copy.png"
const player = {
    x: 20,
    y: canvas.height / 2 - 40,
    width: 15,
    height: 80,
    score: 0,
    color: "cyan"
};

const computer = {
    x: canvas.width - 35,
    y: canvas.height / 2 - 40,
    width: 15,
    height: 80,
    score: 0,
    color: "red"
};

const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 15,
    speed: 5,
    velocityX: 5,
    velocityY: 5
};

let upPressed = false;
let downPressed = false;

window.addEventListener("keydown", function(event) {
    if (event.key === "ArrowUp") upPressed = true;
    else if (event.key === "ArrowDown") downPressed = true;
});

window.addEventListener("keyup", function(event) {
    if (event.key === "ArrowUp") upPressed = false;
    else if (event.key === "ArrowDown") downPressed = false;
});

function drawRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
}

function drawText(text, x, y, color) {
    ctx.fillStyle = color;
    ctx.font = "40px Arial";
    ctx.fillText(text, x, y);
}

function drawNet() {
    for (let i = 0; i <= canvas.height; i += 15) {
        drawRect(canvas.width / 2 - 1, i, 2, 10, "rgba(255,255,255,0.3)");
    }
}

function collision(b, p) {
    b.top = b.y - b.radius;
    b.bottom = b.y + b.radius;
    b.left = b.x - b.radius;
    b.right = b.x + b.radius;

    p.top = p.y;
    p.bottom = p.y + p.height;
    p.left = p.x;
    p.right = p.x + p.width;

    return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.velocityX = -ball.velocityX;
    ball.speed = 5;
}

function update() {
    if (upPressed && player.y > 0) {
        player.y -= 7;
    } else if (downPressed && player.y < canvas.height - player.height) {
        player.y += 7;
    }

    let computerSpeed = 4;
    if (computer.y + computer.height / 2 < ball.y) {
        computer.y += computerSpeed;
    } else {
        computer.y -= computerSpeed;
    }

    ball.x += ball.velocityX;
    ball.y += ball.velocityY;

    if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.velocityY = -ball.velocityY;
    }

    let activePaddle = (ball.x < canvas.width / 2) ? player : computer;

    if (collision(ball, activePaddle)) {
        ball.velocityX = -ball.velocityX;
        ball.speed += 0.2;
    }

    if (ball.x - ball.radius < 0) {
        computer.score++;
        resetBall();
    } else if (ball.x + ball.radius > canvas.width) {
        player.score++;
        resetBall();
      
    }
}

function render() {
    drawRect(0, 0, canvas.width, canvas.height, "#111");

    drawText(player.score, canvas.width / 4, canvas.height / 5, "white");
    drawText(computer.score, 3 * canvas.width / 4, canvas.height / 5, "white");
    drawNet();

    drawRect(player.x, player.y, player.width, player.height, player.color);
    drawRect(computer.x, computer.y, computer.width, computer.height, computer.color);

    if (ballImg.complete && ballImg.naturalHeight !== 0) {
        ctx.drawImage(
            ballImg,
            ball.x - ball.radius,
            ball.y - ball.radius,
            ball.radius * 2,
            ball.radius * 2
        );
    } else {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

function gameLoop() {
    update();
    render();
}

setInterval(gameLoop, 1000 / 60);
</script>
</body>
</html>
